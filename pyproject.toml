[project]
name = "er-commons"
version = "0.1.0"
description = "Small, reproducible glue workflows for environmental-review data and benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "camelot-py==2.0.0",
    "docling==2.115.0",
    "jsonschema>=4.26,<5",
    "opencv-python-headless==5.0.0.93",
    "pikepdf>=10,<11",
    "psutil>=7.2,<8",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pypdf>=6,<7",
    "pypdfium2==5.12.1",
    "requests>=2.32,<3",
    "rfc8785>=0.1.4,<0.2",
    "typer>=0.21,<1",
    "urllib3>=2,<3",
]

[project.scripts]
er-commons = "er_commons.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-dependencies = [
    { package = { name = "rapidocr", version = "3.9.2" }, dependencies = ["opencv-python"] },
]
